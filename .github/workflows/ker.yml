name: Build Kernel SM7325 (Droidspaces Full Support)

# Workflow para compilar o kernel Motorola SM7325 (Lahaina, msm-5.4 QGKI)
# com todas as configs de kernel exigidas pelo runtime de containers Droidspaces
# (namespaces, cgroups v1+v2, netfilter/nf_tables, overlayfs, seccomp/bpf, etc).
#
# Ajuste as variáveis em `env:` conforme seu defconfig real antes de rodar.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Nome do defconfig (arch/arm64/configs/<nome>)"
        required: true
        default: "dubai-qgki_defconfig"
      build_config:
        description: "Arquivo BUILD_CONFIG a usar com build.sh"
        required: true
        default: "build.config.msm.lahaina"
      kernel_name:
        description: "Nome do release do kernel"
        required: true
        default: "sm7325-droidspaces"
      clang_branch:
        description: "Branch do prebuilt Clang (AOSP)"
        required: false
        default: "master-kernel-build-2022"
      enable_kernelsu:
        description: "Integrar KernelSU ao kernel"
        required: false
        default: "true"
      enable_nethunter:
        description: "Habilitar configs NetHunter (USB HID/gadget, BT HID)"
        required: false
        default: "true"
      device:
        description: "Codinome esperado por --device do build.sh (ex.: dubai para o SM7325)"
        required: false
        default: "dubai"
  push:
    branches: [uvite]
    paths:
      - "arch/**"
      - "kernel/**"
      - "drivers/**"
      - "build.config*"
      - ".github/workflows/build-droidspaces-kernel.yml"

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'dubai-qgki_defconfig' }}
  BUILD_CONFIG_FILE: ${{ github.event.inputs.build_config || 'build.config.msm.lahaina' }}
  KERNEL_NAME: ${{ github.event.inputs.kernel_name || 'sm7325-droidspaces' }}
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  GCC64_DIR: ${{ github.workspace }}/toolchains/gcc64
  GCC32_DIR: ${{ github.workspace }}/toolchains/gcc32
  ENABLE_KERNELSU: ${{ github.event.inputs.enable_kernelsu || 'true' }}
  ENABLE_NETHUNTER: ${{ github.event.inputs.enable_nethunter || 'true' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device || 'dubai' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Integrar KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          # Script oficial que adiciona o driver KernelSU em drivers/ e ajusta o Kconfig/Makefile
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          mkdir -p kernel/configs
          echo "CONFIG_KSU=y" >> kernel/configs/kernelsu.config

      - name: Instalar dependências do host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 python3-pip cpio rsync kmod \
            device-tree-compiler lz4 zstd git curl unzip \
            u-boot-tools android-sdk-libsparse-utils

      - name: Descobrir caminhos de prebuilts referenciados nos build.config
        id: toolchain_paths
        run: |
          # ROOT_DIR do build.sh clássico = diretório pai do checkout do kernel.
          # Isso replica o layout de manifest do AOSP (kernel-source vive dentro
          # de ROOT_DIR, junto de prebuilts/, prebuilts-master/, etc).
          ROOT_DIR="$(dirname "$GITHUB_WORKSPACE")/root"
          mkdir -p "$ROOT_DIR"
          ln -sfn "$GITHUB_WORKSPACE" "$ROOT_DIR/$(basename "$GITHUB_WORKSPACE")"
          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

          # Varre a cadeia de build.config em busca de caminhos "prebuilts.../bin"
          # referenciados (nome da variável varia entre forks, então procuramos
          # pelo padrão do caminho, não pelo nome da variável).
          CHAIN="build.config.common build.config.msm.common ${BUILD_CONFIG_FILE}"
          FOUND_PATHS=$(grep -hoE '(prebuilts(-master)?/[A-Za-z0-9_./-]+)' $CHAIN 2>/dev/null | sort -u || true)
          echo "Caminhos de prebuilts referenciados nos build.config:"
          echo "$FOUND_PATHS"
          echo "$FOUND_PATHS" > /tmp/prebuilt_paths.txt

      - name: Popular prebuilts de Clang e GCC nos caminhos esperados
        run: |
          ROOT_DIR="${{ steps.toolchain_paths.outputs.root_dir }}"

          # Clang: repo único da AOSP contém todas as versões clang-rXXXXXX.
          for base in prebuilts/clang/host/linux-x86 prebuilts-master/clang/host/linux-x86; do
            if grep -q "^$base/" /tmp/prebuilt_paths.txt 2>/dev/null || [ ! -d "$ROOT_DIR/$base" ]; then
              mkdir -p "$ROOT_DIR/$base"
              git clone --depth=1 -b master-kernel-build-2022 \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                "$ROOT_DIR/$base" 2>/dev/null || true
            fi
          done

          # GCC aarch64 e arm32 (usados por CROSS_COMPILE / CROSS_COMPILE_ARM32).
          for base in prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 prebuilts-master/gcc/linux-x86/aarch64/aarch64-linux-android-4.9; do
            mkdir -p "$ROOT_DIR/$base"
            git clone --depth=1 -b master \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              "$ROOT_DIR/$base" 2>/dev/null || true
          done
          for base in prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 prebuilts-master/gcc/linux-x86/arm/arm-linux-androideabi-4.9; do
            mkdir -p "$ROOT_DIR/$base"
            git clone --depth=1 -b master \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
              "$ROOT_DIR/$base" 2>/dev/null || true
          done

          echo "Conteúdo de $ROOT_DIR:"
          find "$ROOT_DIR" -maxdepth 4 -type d | sort

      - name: Criar fragmento de config droidspaces.config
        run: |
          mkdir -p kernel/configs
          cat > kernel/configs/droidspaces.config << 'EOF'
          # --- Namespaces (isolamento de containers) ---
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y

          # --- Cgroups v1 + v2 ---
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CPUSETS=y
          CONFIG_BLK_CGROUP=y

          # --- Seccomp + BPF filtering ---
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_HAVE_EBPF_JIT=y

          # --- Filesystems necessários ---
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_QUOTA=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_BLK_DEV_LOOP_MIN_COUNT=16

          # --- devtmpfs ---
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # --- Networking para containers ---
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          CONFIG_TUN=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_NETLINK=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_IPV4=y
          CONFIG_NF_TABLES_IPV6=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_MASQ=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_OPENVSWITCH=y

          # --- Requisito específico do Android que quebra containers ---
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      - name: Criar fragmento de config nethunter.config
        if: env.ENABLE_NETHUNTER == 'true'
        run: |
          mkdir -p kernel/configs
          cat > kernel/configs/nethunter.config << 'EOF'
          # --- USB Gadget ConfigFS (necessário p/ HID attacks, RNDIS, MTP, etc.) ---
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_MTP=y
          CONFIG_USB_CONFIGFS_F_PTP=y
          CONFIG_USB_CONFIGFS_F_ACC=y
          CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_CONFIGFS_F_UAC2=y
          CONFIG_USB_CONFIGFS_F_MIDI=y
          CONFIG_USB_CONFIGFS_F_NCM=y
          CONFIG_USB_CONFIGFS_F_ECM=y
          CONFIG_USB_CONFIGFS_F_EEM=y
          CONFIG_USB_CONFIGFS_F_SUBSET=y
          CONFIG_USB_CONFIGFS_F_RNDIS=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_SERIAL=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y

          # --- USB HID gadget (teclado/mouse attack) ---
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_F_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # --- Bluetooth HID (RFCOMM, BNEP, HIDP) ---
          CONFIG_BT=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HCIVHCI=y

          # --- Wireless / monitor mode (injeção, captura) ---
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_RFKILL=y

          # --- NFC ---
          CONFIG_NFC=y
          EOF

      - name: Detectar build.sh disponível
        id: detect_buildsh
        run: |
          ROOT_DIR="${{ steps.toolchain_paths.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"

          # build.sh pode estar na raiz do kernel (padrão msm-5.4) ou em build/build.sh
          # (Android Common Kernel). Procuramos nos dois lugares, priorizando a raiz.
          if [ -f "$ROOT_DIR/$KDIR_NAME/build.sh" ]; then
            BUILD_SH_REL="build.sh"
          elif [ -f "$ROOT_DIR/$KDIR_NAME/build/build.sh" ]; then
            BUILD_SH_REL="build/build.sh"
          else
            echo "::error::build.sh não encontrado na raiz do kernel nem em build/build.sh."
            exit 1
          fi

          echo "build.sh encontrado em: $BUILD_SH_REL"
          echo "build_sh_rel=$BUILD_SH_REL" >> "$GITHUB_OUTPUT"

          echo "--- Ajuda reportada pelo build.sh (diagnóstico) ---"
          (cd "$ROOT_DIR/$KDIR_NAME" && bash "$BUILD_SH_REL" --help 2>&1) || true

      - name: Detectar defconfig disponível
        id: detect_defconfig
        run: |
          echo "Procurando defconfigs em arch/${ARCH}/configs ..."
          mapfile -t FOUND < <(find "arch/${ARCH}/configs" -iname '*defconfig*' | sort)

          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "::error::Nenhum defconfig encontrado em arch/${ARCH}/configs. Verifique se ARCH está correto (arm64 vs arm)."
            exit 1
          fi

          echo "Defconfigs encontrados:"
          printf '  - %s\n' "${FOUND[@]}"

          TARGET="arch/${ARCH}/configs/${DEFCONFIG}"
          if [ -f "$TARGET" ]; then
            echo "OK: DEFCONFIG '${DEFCONFIG}' existe."
            exit 0
          fi

          echo "::warning::DEFCONFIG '${DEFCONFIG}' não existe nesse repositório."

          # Só considera defconfigs "completos" (terminam em _defconfig), não fragmentos
          # *_GKI.config / *_QGKI.config / *_debug.config, que quase todos compartilham
          # palavras como "qgki" no nome e gerariam falso-positivo.
          mapfile -t FULL_DEFCONFIGS < <(printf '%s\n' "${FOUND[@]}" | grep -E '_defconfig$')

          MATCH=$(printf '%s\n' "${FULL_DEFCONFIGS[@]}" | grep -Ei 'dubai|lahaina|sm7325' | head -n1 || true)
          MATCH_COUNT=$(printf '%s\n' "${FULL_DEFCONFIGS[@]}" | grep -Eic 'dubai|lahaina|sm7325' || true)

          if [ -n "$MATCH" ] && [ "$MATCH_COUNT" -eq 1 ]; then
            REL="${MATCH#arch/${ARCH}/configs/}"
            echo "Usando candidato único detectado automaticamente: $REL"
            echo "DEFCONFIG=$REL" >> "$GITHUB_ENV"
          else
            echo "::error::Não foi possível decidir automaticamente. Defconfigs completos disponíveis:"
            printf '  - %s\n' "${FULL_DEFCONFIGS[@]}"
            echo "::error::Rode o workflow de novo passando 'defconfig' com um dos valores acima (relativo a arch/${ARCH}/configs/)."
            exit 1
          fi

      - name: Aplicar fragmentos ao defconfig
        run: |
          # build.sh chama "make ... ${DEFCONFIG}" e depois "make ... oldconfig"
          # por conta própria, então em vez de montar o .config na mão, anexamos
          # os fragmentos direto no defconfig do repo. Entradas posteriores
          # sobrescrevem as anteriores quando o Kconfig processa o arquivo.
          FRAGMENTS="kernel/configs/droidspaces.config"
          [ "$ENABLE_KERNELSU" = "true" ] && [ -f kernel/configs/kernelsu.config ] && \
            FRAGMENTS="$FRAGMENTS kernel/configs/kernelsu.config"
          [ "$ENABLE_NETHUNTER" = "true" ] && [ -f kernel/configs/nethunter.config ] && \
            FRAGMENTS="$FRAGMENTS kernel/configs/nethunter.config"

          echo "Fragmentos aplicados em arch/${ARCH}/configs/${DEFCONFIG}: $FRAGMENTS"

          TARGET="arch/${ARCH}/configs/${DEFCONFIG}"
          for f in $FRAGMENTS; do
            echo "" >> "$TARGET"
            echo "# --- fragmento: $f ---" >> "$TARGET"
            cat "$f" >> "$TARGET"
          done

      - name: Compilar kernel com build.sh
        id: build
        run: |
          ROOT_DIR="${{ steps.toolchain_paths.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"
          BUILD_SH_REL="${{ steps.detect_buildsh.outputs.build_sh_rel }}"

          # Este build.sh NÃO segue a convenção AOSP (BUILD_CONFIG); é um script
          # próprio (estilo "AtomX.sh") com flags dedicadas. Ver "--help" no log
          # da etapa "Detectar build.sh disponível" caso essas flags mudem.
          export PATH="$CLANG_DIR"/clang-r*/bin:"$GCC64_DIR"/bin:"$GCC32_DIR"/bin:"$PATH"

          echo "ROOT_DIR=$ROOT_DIR"
          echo "Executando: $BUILD_SH_REL --device $DEVICE_CODENAME --compiler clang --dtbs"

          cd "$ROOT_DIR/$KDIR_NAME"
          set +e
          bash "$BUILD_SH_REL" \
            --device "$DEVICE_CODENAME" \
            --compiler clang \
            --dtbs \
            --log 2>&1 | tee "$ROOT_DIR/$KDIR_NAME/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          # O script pode "sair com sucesso" mesmo só mostrando a tela de uso
          # (foi o que causou o run anterior a falhar silenciosamente na
          # validação). Detectamos isso aqui e falhamos com uma mensagem clara.
          if grep -qi "^ usage:" "$ROOT_DIR/$KDIR_NAME/build.log"; then
            echo "::error::build.sh só imprimiu a tela de uso: os argumentos --device/--compiler/--dtbs não foram aceitos como esperado. Confira o --help logado na etapa 'Detectar build.sh disponível' e ajuste os argumentos desta etapa (ou o input 'device')."
            exit 1
          fi

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::build.sh terminou com código $BUILD_STATUS."
            exit 1
          fi

          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validar se as configs do Droidspaces foram aplicadas
        run: |
          ROOT_DIR="${{ steps.build.outputs.root_dir }}"

          # O build.sh escreve o .config final em algum lugar dentro de out/ (o
          # caminho exato varia conforme o build.config), então localizamos o
          # mais recente em vez de assumir um caminho fixo.
          CFG=$(find "$ROOT_DIR" -path '*/out/*' -name '.config' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)

          if [ -z "$CFG" ]; then
            echo "::error::Não foi possível localizar o .config gerado pelo build.sh dentro de $ROOT_DIR."
            exit 1
          fi
          echo "Validando: $CFG"
          echo "cfg_path=$CFG" >> /tmp/cfg_path.txt

          REQUIRED="CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_CGROUPS CONFIG_CGROUP_BPF \
                    CONFIG_OVERLAY_FS CONFIG_SECCOMP_FILTER CONFIG_NF_TABLES \
                    CONFIG_DEVPTS_MULTIPLE_INSTANCES CONFIG_BRIDGE CONFIG_VETH"

          if [ "$ENABLE_KERNELSU" = "true" ]; then
            REQUIRED="$REQUIRED CONFIG_KSU"
          fi

          if [ "$ENABLE_NETHUNTER" = "true" ]; then
            REQUIRED="$REQUIRED CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_F_HID \
                      CONFIG_BT_HIDP CONFIG_UHID"
          fi

          MISSING=0
          for opt in $REQUIRED; do
            if ! grep -q "^${opt}=y" "$CFG"; then
              echo "::error::Config ausente ou não habilitada: $opt"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Uma ou mais configs obrigatórias não foram aplicadas."
            exit 1
          fi
          echo "Todas as configs (Droidspaces/KernelSU/NetHunter) foram validadas com sucesso."

      - name: Empacotar artefatos
        run: |
          ROOT_DIR="${{ steps.build.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"
          mkdir -p artifacts

          # build.sh costuma copiar os artefatos finais para um DIST_DIR (algo como
          # out/<branch>/dist); se existir, priorizamos essa pasta. Caso contrário,
          # buscamos direto dentro de out/.
          DIST_DIR=$(find "$ROOT_DIR" -type d -name "dist" -path '*/out/*' 2>/dev/null | head -n1)
          SEARCH_DIR="${DIST_DIR:-$ROOT_DIR}"

          find "$SEARCH_DIR" -maxdepth 6 -iname "Image" -exec cp {} artifacts/ \; 2>/dev/null || true
          find "$SEARCH_DIR" -maxdepth 6 -iname "Image.gz" -exec cp {} artifacts/ \; 2>/dev/null || true
          find "$SEARCH_DIR" -maxdepth 6 -iname "dtbo.img" -exec cp {} artifacts/ \; 2>/dev/null || true
          find "$ROOT_DIR" -path '*/out/*' -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true

          CFG=$(find "$ROOT_DIR" -path '*/out/*' -name '.config' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n1 | cut -d' ' -f2-)
          [ -n "$CFG" ] && cp "$CFG" "artifacts/${KERNEL_NAME}.config"

          cp "$ROOT_DIR/$KDIR_NAME/build.log" artifacts/ 2>/dev/null || true

          {
            echo "defconfig: $DEFCONFIG"
            echo "kernelsu: $ENABLE_KERNELSU"
            echo "nethunter: $ENABLE_NETHUNTER"
            echo "commit: ${{ github.sha }}"
          } > artifacts/BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
