name: Build Kernel SM7325 (Droidspaces Full Support)

# Workflow para compilar o kernel Motorola SM7325 (Lahaina, msm-5.4 QGKI)
# com todas as configs de kernel exigidas pelo runtime de containers Droidspaces
# (namespaces, cgroups v1+v2, netfilter/nf_tables, overlayfs, seccomp/bpf, etc).
#
# Ajuste as variáveis em `env:` conforme seu defconfig real antes de rodar.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Nome do defconfig (arch/arm64/configs/<nome>)"
        required: true
        default: "dubai-qgki_defconfig"
      kernel_name:
        description: "Nome do release do kernel"
        required: true
        default: "sm7325-droidspaces"
      clang_branch:
        description: "Branch do prebuilt Clang (AOSP)"
        required: false
        default: "master-kernel-build-2022"
      enable_kernelsu:
        description: "Integrar KernelSU ao kernel"
        required: false
        default: "true"
      enable_nethunter:
        description: "Habilitar configs NetHunter (USB HID/gadget, BT HID)"
        required: false
        default: "true"
  push:
    branches: [uvite]
    paths:
      - "arch/**"
      - "kernel/**"
      - "drivers/**"
      - "build.config*"
      - ".github/workflows/build-droidspaces-kernel.yml"

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'dubai-qgki_defconfig' }}
  KERNEL_NAME: ${{ github.event.inputs.kernel_name || 'sm7325-droidspaces' }}
  OUT_DIR: out
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang
  GCC64_DIR: ${{ github.workspace }}/toolchains/gcc64
  GCC32_DIR: ${{ github.workspace }}/toolchains/gcc32
  ENABLE_KERNELSU: ${{ github.event.inputs.enable_kernelsu || 'true' }}
  ENABLE_NETHUNTER: ${{ github.event.inputs.enable_nethunter || 'true' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Integrar KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          # Script oficial que adiciona o driver KernelSU em drivers/ e ajusta o Kconfig/Makefile
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          mkdir -p kernel/configs
          echo "CONFIG_KSU=y" >> kernel/configs/kernelsu.config

      - name: Instalar dependências do host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 python3-pip cpio rsync kmod \
            device-tree-compiler lz4 zstd git curl unzip \
            u-boot-tools android-sdk-libsparse-utils

      - name: Baixar toolchain Clang (AOSP prebuilt)
        run: |
          mkdir -p "$CLANG_DIR"
          git clone --depth=1 -b ${{ github.event.inputs.clang_branch || 'master-kernel-build-2022' }} \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$CLANG_DIR"

      - name: Baixar toolchain GCC (arm64 + arm)
        run: |
          mkdir -p "$GCC64_DIR" "$GCC32_DIR"
          git clone --depth=1 -b master \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 "$GCC64_DIR"
          git clone --depth=1 -b master \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 "$GCC32_DIR"

      - name: Exportar variáveis de toolchain
        run: |
          echo "$CLANG_DIR/clang-r*/bin" >> $GITHUB_PATH
          echo "$(echo $CLANG_DIR/clang-r*/bin)" >> $GITHUB_PATH
          echo "$GCC64_DIR/bin" >> $GITHUB_PATH
          echo "$GCC32_DIR/bin" >> $GITHUB_PATH

      - name: Criar fragmento de config droidspaces.config
        run: |
          mkdir -p kernel/configs
          cat > kernel/configs/droidspaces.config << 'EOF'
          # --- Namespaces (isolamento de containers) ---
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y

          # --- Cgroups v1 + v2 ---
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CPUSETS=y
          CONFIG_BLK_CGROUP=y

          # --- Seccomp + BPF filtering ---
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_HAVE_EBPF_JIT=y

          # --- Filesystems necessários ---
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_QUOTA=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_BLK_DEV_LOOP_MIN_COUNT=16

          # --- devtmpfs ---
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # --- Networking para containers ---
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          CONFIG_TUN=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_NETLINK=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_IPV4=y
          CONFIG_NF_TABLES_IPV6=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_MASQ=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_OPENVSWITCH=y

          # --- Requisito específico do Android que quebra containers ---
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      - name: Criar fragmento de config nethunter.config
        if: env.ENABLE_NETHUNTER == 'true'
        run: |
          mkdir -p kernel/configs
          cat > kernel/configs/nethunter.config << 'EOF'
          # --- USB Gadget ConfigFS (necessário p/ HID attacks, RNDIS, MTP, etc.) ---
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_MTP=y
          CONFIG_USB_CONFIGFS_F_PTP=y
          CONFIG_USB_CONFIGFS_F_ACC=y
          CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_CONFIGFS_F_UAC2=y
          CONFIG_USB_CONFIGFS_F_MIDI=y
          CONFIG_USB_CONFIGFS_F_NCM=y
          CONFIG_USB_CONFIGFS_F_ECM=y
          CONFIG_USB_CONFIGFS_F_EEM=y
          CONFIG_USB_CONFIGFS_F_SUBSET=y
          CONFIG_USB_CONFIGFS_F_RNDIS=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_SERIAL=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y

          # --- USB HID gadget (teclado/mouse attack) ---
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_F_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # --- Bluetooth HID (RFCOMM, BNEP, HIDP) ---
          CONFIG_BT=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HCIVHCI=y

          # --- Wireless / monitor mode (injeção, captura) ---
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_RFKILL=y

          # --- NFC ---
          CONFIG_NFC=y
          EOF

      - name: Detectar defconfig disponível
        id: detect_defconfig
        run: |
          echo "Procurando defconfigs em arch/${ARCH}/configs ..."
          mapfile -t FOUND < <(find "arch/${ARCH}/configs" -iname '*defconfig*' | sort)

          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "::error::Nenhum defconfig encontrado em arch/${ARCH}/configs. Verifique se ARCH está correto (arm64 vs arm)."
            exit 1
          fi

          echo "Defconfigs encontrados:"
          printf '  - %s\n' "${FOUND[@]}"

          TARGET="arch/${ARCH}/configs/${DEFCONFIG}"
          if [ -f "$TARGET" ]; then
            echo "OK: DEFCONFIG '${DEFCONFIG}' existe."
            exit 0
          fi

          echo "::warning::DEFCONFIG '${DEFCONFIG}' não existe nesse repositório."

          # Só considera defconfigs "completos" (terminam em _defconfig), não fragmentos
          # *_GKI.config / *_QGKI.config / *_debug.config, que quase todos compartilham
          # palavras como "qgki" no nome e gerariam falso-positivo.
          mapfile -t FULL_DEFCONFIGS < <(printf '%s\n' "${FOUND[@]}" | grep -E '_defconfig$')

          MATCH=$(printf '%s\n' "${FULL_DEFCONFIGS[@]}" | grep -Ei 'dubai|lahaina|sm7325' | head -n1 || true)
          MATCH_COUNT=$(printf '%s\n' "${FULL_DEFCONFIGS[@]}" | grep -Eic 'dubai|lahaina|sm7325' || true)

          if [ -n "$MATCH" ] && [ "$MATCH_COUNT" -eq 1 ]; then
            REL="${MATCH#arch/${ARCH}/configs/}"
            echo "Usando candidato único detectado automaticamente: $REL"
            echo "DEFCONFIG=$REL" >> "$GITHUB_ENV"
          else
            echo "::error::Não foi possível decidir automaticamente. Defconfigs completos disponíveis:"
            printf '  - %s\n' "${FULL_DEFCONFIGS[@]}"
            echo "::error::Rode o workflow de novo passando 'defconfig' com um dos valores acima (relativo a arch/${ARCH}/configs/)."
            exit 1
          fi

      - name: Gerar defconfig base e aplicar fragmento (merge_config.sh)
        run: |
          export ARCH SUBARCH
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p "$OUT_DIR"

          FRAGMENTS="kernel/configs/droidspaces.config"
          [ "$ENABLE_KERNELSU" = "true" ] && [ -f kernel/configs/kernelsu.config ] && \
            FRAGMENTS="$FRAGMENTS kernel/configs/kernelsu.config"
          [ "$ENABLE_NETHUNTER" = "true" ] && [ -f kernel/configs/nethunter.config ] && \
            FRAGMENTS="$FRAGMENTS kernel/configs/nethunter.config"

          echo "Fragmentos aplicados: $FRAGMENTS"
          scripts/kconfig/merge_config.sh -O "$OUT_DIR" \
            "arch/${ARCH}/configs/${DEFCONFIG}" \
            $FRAGMENTS

      - name: Validar se as configs do Droidspaces foram aplicadas
        run: |
          CFG="$OUT_DIR/.config"
          REQUIRED="CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_CGROUPS CONFIG_CGROUP_BPF \
                    CONFIG_OVERLAY_FS CONFIG_SECCOMP_FILTER CONFIG_NF_TABLES \
                    CONFIG_DEVPTS_MULTIPLE_INSTANCES CONFIG_BRIDGE CONFIG_VETH"

          if [ "$ENABLE_KERNELSU" = "true" ]; then
            REQUIRED="$REQUIRED CONFIG_KSU"
          fi

          if [ "$ENABLE_NETHUNTER" = "true" ]; then
            REQUIRED="$REQUIRED CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_F_HID \
                      CONFIG_BT_HIDP CONFIG_UHID"
          fi

          MISSING=0
          for opt in $REQUIRED; do
            if ! grep -q "^${opt}=y" "$CFG"; then
              echo "::error::Config ausente ou não habilitada: $opt"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Uma ou mais configs obrigatórias não foram aplicadas."
            exit 1
          fi
          echo "Todas as configs (Droidspaces/KernelSU/NetHunter) foram validadas com sucesso."

      - name: Compilar kernel
        run: |
          export ARCH SUBARCH
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH="$CLANG_DIR/clang-r"*/bin:"$PATH"

          make -j"$(nproc --all)" O="$OUT_DIR" \
            ARCH=$ARCH \
            CC=clang \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            Image dtbs dtbo.img 2>&1 | tee build.log

      - name: Empacotar artefatos
        run: |
          mkdir -p artifacts
          cp "$OUT_DIR/arch/$ARCH/boot/Image" artifacts/ 2>/dev/null || true
          cp "$OUT_DIR/arch/$ARCH/boot/Image.gz" artifacts/ 2>/dev/null || true
          cp "$OUT_DIR/arch/$ARCH/boot/dtbo.img" artifacts/ 2>/dev/null || true
          find "$OUT_DIR/arch/$ARCH/boot/dts" -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp "$OUT_DIR/.config" "artifacts/${KERNEL_NAME}.config"
          cp build.log artifacts/ 2>/dev/null || true

          {
            echo "defconfig: $DEFCONFIG"
            echo "kernelsu: $ENABLE_KERNELSU"
            echo "nethunter: $ENABLE_NETHUNTER"
            echo "commit: ${{ github.sha }}"
          } > artifacts/BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
