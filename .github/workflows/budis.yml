name: Build Kernel SM7325 (Droidspaces Full Support)

# Workflow para compilar o kernel Motorola SM7325 (dubai/Lahaina, msm-5.4 QGKI)
# com todas as configs de kernel exigidas pelo runtime de containers Droidspaces
# (namespaces, cgroups v1+v2, netfilter/nf_tables, overlayfs, seccomp/bpf, etc).
#
# O build.sh deste repositório é um script próprio ("AtomX.sh"), não o build.sh
# padrão da AOSP:
#   - as flags são no formato --flag=valor (com "="), não "--flag valor";
#   - ele espera o clang "achatado" em <ROOT_DIR>/toolchains/clang/bin/clang;
#   - o fluxo padrão (sem passar --obj/--dtbs) sempre termina chamando
#     zipper(), que EXIGE um diretório AnyKernel3 ao lado do checkout do
#     kernel para gerar um zip flashável.
# Como não há um fork do AnyKernel3 configurado para este dispositivo, este
# workflow usa `--obj=Image` e `--dtbs` (sem `--dtb_zip`), que compilam e saem
# ANTES de tentar montar o zip — não precisam do AnyKernel3. O artefato final
# é a Image + dtbo/dtb "crus", sem zip flashável.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Nome do defconfig (arch/arm64/configs/<nome>)"
        required: true
        default: "dubai-qgki_defconfig"
      kernel_name:
        description: "Nome do release do kernel"
        required: true
        default: "sm7325-droidspaces"
      enable_kernelsu:
        description: "Integrar KernelSU ao kernel"
        required: false
        default: "true"
      enable_nethunter:
        description: "Habilitar configs NetHunter (USB HID/gadget, BT HID)"
        required: false
        default: "true"
      device:
        description: "Codinome esperado por --device do build.sh (apenas 'dubai' ou 'lahaina' são tratados sem prompt interativo)"
        required: false
        default: "dubai"
  push:
    branches: [uvite]
    paths:
      - "arch/**"
      - "kernel/**"
      - "drivers/**"
      - "build.config*"
      - ".github/workflows/build-droidspaces-kernel.yml"

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'dubai-qgki_defconfig' }}
  KERNEL_NAME: ${{ github.event.inputs.kernel_name || 'sm7325-droidspaces' }}
  ENABLE_KERNELSU: ${{ github.event.inputs.enable_kernelsu || 'true' }}
  ENABLE_NETHUNTER: ${{ github.event.inputs.enable_nethunter || 'true' }}
  DEVICE_CODENAME: ${{ github.event.inputs.device || 'dubai' }}

jobs:
  build:
    # ubuntu-24.04 (glibc 2.39) é necessário porque o binário do Neutron-Clang
    # baixado pelo antman exige GLIBC >= 2.36/2.38; ubuntu-22.04 (glibc 2.35)
    # falha com "version `GLIBC_2.3x' not found".
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Integrar KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          # Script oficial que adiciona o driver KernelSU em drivers/ e ajusta o Kconfig/Makefile
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          mkdir -p kernel/configs
          echo "CONFIG_KSU=y" >> kernel/configs/kernelsu.config

      - name: Instalar dependências do host
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 python3-pip cpio rsync kmod \
            device-tree-compiler lz4 zstd git curl unzip perl \
            u-boot-tools android-sdk-libsparse-utils \
            gcc-arm-linux-gnueabi

      - name: Preparar ROOT_DIR (layout esperado pelo build.sh)
        id: toolchain_paths
        run: |
          # build.sh calcula PRO_PATH = KERNEL_DIR/.. e espera toolchains/
          # (e, se formos gerar zip, AnyKernel3/) ao lado do checkout do kernel.
          # Criamos esse layout com um symlink apontando de volta pro workspace.
          ROOT_DIR="$(dirname "$GITHUB_WORKSPACE")/root"
          mkdir -p "$ROOT_DIR"
          ln -sfn "$GITHUB_WORKSPACE" "$ROOT_DIR/$(basename "$GITHUB_WORKSPACE")"
          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Instalar toolchain Clang standalone (Neutron-Clang via antman)
        run: |
          ROOT_DIR="${{ steps.toolchain_paths.outputs.root_dir }}"
          mkdir -p "$ROOT_DIR/toolchains"

          # build.sh espera o clang "achatado" direto em toolchains/clang/bin/clang
          # (não a árvore aninhada de prebuilts da AOSP). O antman do Neutron-Clang
          # baixa e extrai a release mais recente exatamente nesse formato.
          git clone --depth=1 https://github.com/Neutron-Toolchains/antman -b main "$ROOT_DIR/toolchains/clang"
          (cd "$ROOT_DIR/toolchains/clang" && bash antman -S)

          if [ ! -x "$ROOT_DIR/toolchains/clang/bin/clang" ]; then
            echo "::error::Clang não encontrado em $ROOT_DIR/toolchains/clang/bin/clang após 'antman -S'. Se o Neutron-Clang estiver indisponível, troque esta etapa por outro toolchain 'achatado' (ex.: WeebX-Clang) extraído no mesmo caminho."
            exit 1
          fi
          "$ROOT_DIR/toolchains/clang/bin/clang" --version

      - name: Criar fragmento de config droidspaces.config
        run: |
          mkdir -p kernel/configs
          cat > kernel/configs/droidspaces.config << 'EOF'
          # --- Namespaces (isolamento de containers) ---
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y

          # --- Cgroups v1 + v2 ---
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CPUSETS=y
          CONFIG_BLK_CGROUP=y

          # --- Seccomp + BPF filtering ---
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_HAVE_EBPF_JIT=y

          # --- Filesystems necessários ---
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_QUOTA=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_BLK_DEV_LOOP_MIN_COUNT=16

          # --- devtmpfs ---
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # --- Networking para containers ---
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          CONFIG_TUN=y
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NETFILTER_NETLINK=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NF_TABLES=y
          CONFIG_NF_TABLES_IPV4=y
          CONFIG_NF_TABLES_IPV6=y
          CONFIG_NFT_NAT=y
          CONFIG_NFT_MASQ=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_OPENVSWITCH=y

          # --- Requisito específico do Android que quebra containers ---
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      - name: Criar fragmento de config nethunter.config
        if: env.ENABLE_NETHUNTER == 'true'
        run: |
          mkdir -p kernel/configs
          cat > kernel/configs/nethunter.config << 'EOF'
          # --- USB Gadget ConfigFS (necessário p/ HID attacks, RNDIS, MTP, etc.) ---
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_MTP=y
          CONFIG_USB_CONFIGFS_F_PTP=y
          CONFIG_USB_CONFIGFS_F_ACC=y
          CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_CONFIGFS_F_UAC2=y
          CONFIG_USB_CONFIGFS_F_MIDI=y
          CONFIG_USB_CONFIGFS_F_NCM=y
          CONFIG_USB_CONFIGFS_F_ECM=y
          CONFIG_USB_CONFIGFS_F_EEM=y
          CONFIG_USB_CONFIGFS_F_SUBSET=y
          CONFIG_USB_CONFIGFS_F_RNDIS=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_F_SERIAL=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_FS=y

          # --- USB HID gadget (teclado/mouse attack) ---
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_F_HID=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y

          # --- Bluetooth HID (RFCOMM, BNEP, HIDP) ---
          CONFIG_BT=y
          CONFIG_BT_HIDP=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_BNEP=y
          CONFIG_BT_BNEP_MC_FILTER=y
          CONFIG_BT_BNEP_PROTO_FILTER=y
          CONFIG_BT_HCIVHCI=y

          # --- Wireless / monitor mode (injeção, captura) ---
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_RFKILL=y

          # --- NFC ---
          CONFIG_NFC=y
          EOF

      - name: Detectar build.sh disponível
        id: detect_buildsh
        run: |
          ROOT_DIR="${{ steps.toolchain_paths.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"

          # build.sh pode estar na raiz do kernel (padrão msm-5.4) ou em build/build.sh
          # (Android Common Kernel). Procuramos nos dois lugares, priorizando a raiz.
          if [ -f "$ROOT_DIR/$KDIR_NAME/build.sh" ]; then
            BUILD_SH_REL="build.sh"
          elif [ -f "$ROOT_DIR/$KDIR_NAME/build/build.sh" ]; then
            BUILD_SH_REL="build/build.sh"
          else
            echo "::error::build.sh não encontrado na raiz do kernel nem em build/build.sh."
            exit 1
          fi

          echo "build.sh encontrado em: $BUILD_SH_REL"
          echo "build_sh_rel=$BUILD_SH_REL" >> "$GITHUB_OUTPUT"

          echo "--- Ajuda reportada pelo build.sh (diagnóstico) ---"
          (cd "$ROOT_DIR/$KDIR_NAME" && bash "$BUILD_SH_REL" --help 2>&1) || true

      - name: Validar codinome do dispositivo
        run: |
          # build.sh só trata "dubai" e "lahaina" sem interação; qualquer outro
          # valor cai no "read -rp" (prompt interativo), que travaria o job até
          # o timeout. Falhamos cedo em vez disso.
          case "$DEVICE_CODENAME" in
            dubai|lahaina) ;;
            *)
              echo "::error::DEVICE_CODENAME='$DEVICE_CODENAME' não é tratado pelo case do build.sh (só 'dubai' e 'lahaina'); qualquer outro valor faria o script pedir input interativo (read -rp) e travar o job. Ajuste o input 'device' ou adicione um novo caso no build.sh."
              exit 1
              ;;
          esac

      - name: Detectar defconfig disponível
        id: detect_defconfig
        run: |
          echo "Procurando defconfigs em arch/${ARCH}/configs ..."
          mapfile -t FOUND < <(find "arch/${ARCH}/configs" -iname '*defconfig*' | sort)

          if [ "${#FOUND[@]}" -eq 0 ]; then
            echo "::error::Nenhum defconfig encontrado em arch/${ARCH}/configs. Verifique se ARCH está correto (arm64 vs arm)."
            exit 1
          fi

          echo "Defconfigs encontrados:"
          printf '  - %s\n' "${FOUND[@]}"

          TARGET="arch/${ARCH}/configs/${DEFCONFIG}"
          if [ -f "$TARGET" ]; then
            echo "OK: DEFCONFIG '${DEFCONFIG}' existe."
            exit 0
          fi

          echo "::warning::DEFCONFIG '${DEFCONFIG}' não existe nesse repositório."

          # Só considera defconfigs "completos" (terminam em _defconfig), não fragmentos
          # *_GKI.config / *_QGKI.config / *_debug.config, que quase todos compartilham
          # palavras como "qgki" no nome e gerariam falso-positivo.
          mapfile -t FULL_DEFCONFIGS < <(printf '%s\n' "${FOUND[@]}" | grep -E '_defconfig$')

          MATCH=$(printf '%s\n' "${FULL_DEFCONFIGS[@]}" | grep -Ei 'dubai|lahaina|sm7325' | head -n1 || true)
          MATCH_COUNT=$(printf '%s\n' "${FULL_DEFCONFIGS[@]}" | grep -Eic 'dubai|lahaina|sm7325' || true)

          if [ -n "$MATCH" ] && [ "$MATCH_COUNT" -eq 1 ]; then
            REL="${MATCH#arch/${ARCH}/configs/}"
            echo "Usando candidato único detectado automaticamente: $REL"
            echo "DEFCONFIG=$REL" >> "$GITHUB_ENV"
          else
            echo "::error::Não foi possível decidir automaticamente. Defconfigs completos disponíveis:"
            printf '  - %s\n' "${FULL_DEFCONFIGS[@]}"
            echo "::error::Rode o workflow de novo passando 'defconfig' com um dos valores acima (relativo a arch/${ARCH}/configs/)."
            exit 1
          fi

      - name: Aplicar fragmentos ao defconfig
        run: |
          # build.sh chama "make ... ${DEFCONFIG}" e depois "make ... oldconfig"
          # por conta própria, então em vez de montar o .config na mão, anexamos
          # os fragmentos direto no defconfig do repo. Entradas posteriores
          # sobrescrevem as anteriores quando o Kconfig processa o arquivo.
          FRAGMENTS="kernel/configs/droidspaces.config"
          [ "$ENABLE_KERNELSU" = "true" ] && [ -f kernel/configs/kernelsu.config ] && \
            FRAGMENTS="$FRAGMENTS kernel/configs/kernelsu.config"
          [ "$ENABLE_NETHUNTER" = "true" ] && [ -f kernel/configs/nethunter.config ] && \
            FRAGMENTS="$FRAGMENTS kernel/configs/nethunter.config"

          echo "Fragmentos aplicados em arch/${ARCH}/configs/${DEFCONFIG}: $FRAGMENTS"

          TARGET="arch/${ARCH}/configs/${DEFCONFIG}"
          for f in $FRAGMENTS; do
            echo "" >> "$TARGET"
            echo "# --- fragmento: $f ---" >> "$TARGET"
            cat "$f" >> "$TARGET"
          done

      - name: Compilar Image e dtbs com build.sh
        id: build
        run: |
          ROOT_DIR="${{ steps.toolchain_paths.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"
          BUILD_SH_REL="${{ steps.detect_buildsh.outputs.build_sh_rel }}"

          # Este build.sh (AtomX.sh) usa flags "--flag=valor" (com "="), não
          # "--flag valor". --obj=Image e --dtbs (sem --dtb_zip) compilam e
          # saem ANTES de chamar zipper(), então não exigem o AnyKernel3 que
          # não temos configurado. O fluxo padrão (sem --obj/--dtbs) sempre
          # tentaria gerar um zip flashável e falharia por falta dele.
          cd "$ROOT_DIR/$KDIR_NAME"
          rm -f "$ROOT_DIR/$KDIR_NAME/build.log"

          run_atomx() {
            echo "Executando: bash $BUILD_SH_REL $*"
            set +e
            bash "$BUILD_SH_REL" "$@" 2>&1 | tee -a "$ROOT_DIR/$KDIR_NAME/build.log"
            local status=${PIPESTATUS[0]}
            set -e

            # O script pode terminar com código != 0 (usage() sai com exit 2)
            # sem que o `tee` propague isso automaticamente para o step; por
            # isso checamos PIPESTATUS explicitamente.
            if grep -qi "usage:" "$ROOT_DIR/$KDIR_NAME/build.log"; then
              echo "::error::build.sh só mostrou a tela de ajuda para os argumentos: $*. Confira a sintaxe --flag=valor e o --help logado na etapa 'Detectar build.sh disponível'."
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::build.sh terminou com código $status para os argumentos: $*"
              exit 1
            fi
          }

          run_atomx --compiler=clang --device="$DEVICE_CODENAME" --obj=Image
          run_atomx --compiler=clang --device="$DEVICE_CODENAME" --dtbs

          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Validar se as configs do Droidspaces foram aplicadas
        run: |
          ROOT_DIR="${{ steps.build.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"

          # O build.sh compila com O=work (ver MAKE_ARGS em compiler_setup),
          # então o .config final fica em <kernel>/work/.config.
          CFG="$ROOT_DIR/$KDIR_NAME/work/.config"

          if [ ! -f "$CFG" ]; then
            echo "::error::Não foi possível localizar $CFG (esperado após o build com O=work)."
            exit 1
          fi
          echo "Validando: $CFG"

          REQUIRED="CONFIG_NAMESPACES CONFIG_USER_NS CONFIG_CGROUPS CONFIG_CGROUP_BPF \
                    CONFIG_OVERLAY_FS CONFIG_SECCOMP_FILTER CONFIG_NF_TABLES \
                    CONFIG_DEVPTS_MULTIPLE_INSTANCES CONFIG_BRIDGE CONFIG_VETH"

          if [ "$ENABLE_KERNELSU" = "true" ]; then
            REQUIRED="$REQUIRED CONFIG_KSU"
          fi

          if [ "$ENABLE_NETHUNTER" = "true" ]; then
            REQUIRED="$REQUIRED CONFIG_USB_CONFIGFS CONFIG_USB_CONFIGFS_F_HID \
                      CONFIG_BT_HIDP CONFIG_UHID"
          fi

          MISSING=0
          for opt in $REQUIRED; do
            if ! grep -q "^${opt}=y" "$CFG"; then
              echo "::error::Config ausente ou não habilitada: $opt"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Uma ou mais configs obrigatórias não foram aplicadas."
            exit 1
          fi
          echo "Todas as configs (Droidspaces/KernelSU/NetHunter) foram validadas com sucesso."

      - name: Empacotar artefatos
        run: |
          ROOT_DIR="${{ steps.build.outputs.root_dir }}"
          KDIR_NAME="$(basename "$GITHUB_WORKSPACE")"
          WORK_DIR="$ROOT_DIR/$KDIR_NAME/work"
          BOOT_DIR="$WORK_DIR/arch/${ARCH}/boot"
          mkdir -p artifacts

          # O build.sh compila com O=work, então tudo fica em <kernel>/work/,
          # seguindo a árvore padrão arch/<ARCH>/boot/ do kernel. Não geramos
          # zip flashável (sem AnyKernel3 configurado) — artefatos "crus".
          cp "$BOOT_DIR/Image" artifacts/ 2>/dev/null || true
          cp "$BOOT_DIR/Image.gz" artifacts/ 2>/dev/null || true
          cp "$BOOT_DIR/dtbo.img" artifacts/ 2>/dev/null || true
          find "$BOOT_DIR" -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true

          [ -f "$WORK_DIR/.config" ] && cp "$WORK_DIR/.config" "artifacts/${KERNEL_NAME}.config"
          cp "$ROOT_DIR/$KDIR_NAME/build.log" artifacts/ 2>/dev/null || true

          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::Nenhum artefato encontrado em $BOOT_DIR / $WORK_DIR — confira o build.log."
            exit 1
          fi

          {
            echo "defconfig: $DEFCONFIG"
            echo "device: $DEVICE_CODENAME"
            echo "kernelsu: $ENABLE_KERNELSU"
            echo "nethunter: $ENABLE_NETHUNTER"
            echo "commit: ${{ github.sha }}"
            echo "obs: build via --obj=Image + --dtbs (sem AnyKernel3 configurado, sem zip flashável)"
          } > artifacts/BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
